name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENVM_VERSION: v0.2.16   # genvm-lint pin (audit P2-4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: relayer/package-lock.json
      - name: Cache GenVM SDK release (downloaded by genlayer-test direct mode)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-${{ hashFiles('contracts/judge_router.py', 'contracts/requirements.txt') }}
      - name: Cache GenVM release used by genvm-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-linter-v0.2.16
      - name: Verify (same script as a fresh clone)
        run: bash scripts/verify.sh
