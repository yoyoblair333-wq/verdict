name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pinned image: ubuntu-latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # One GenVM pin for both genvm-lint and the direct-mode test SDK
      # (contracts/tests/direct/conftest.py). Unpinned, direct mode loads
      # whatever GenVM release GitHub calls "latest" (the 2026-10-31 CI failure).
      GENVM_VERSION: v0.2.16
      # Authenticated GitHub release downloads (avoids the shared-runner
      # anonymous rate limit). Read-only token for this repository.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # The version verify.sh is proven on. The test runner
          # (relayer/scripts/run-tests.mjs) also works on Node 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            relayer/package-lock.json
            web/package-lock.json
      - name: Cache GenVM SDK release (downloaded by genlayer-test direct mode)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-${{ env.GENVM_VERSION }}
      - name: Cache GenVM release used by genvm-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-linter-${{ env.GENVM_VERSION }}
      - name: Playwright Chromium + its OS libraries (web offline tests)
        # verify.sh installs the browser itself; this step adds the system
        # libraries Chromium needs on a bare runner (apt, needs sudo).
        run: cd web && npm ci --no-audit --no-fund && npx --no-install playwright install --with-deps chromium
      - name: Verify (same script as a fresh clone)
        run: bash scripts/verify.sh
